<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5E9DC" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#241A13" media="(prefers-color-scheme:dark)">
<title>יפן 2026 · בר ונועה</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
/* ---------------------------------------------------------------------------
   FONT — no CDN call at runtime (used on mobile data in rural Japan, §4).
   The stack below resolves to SF Pro / SF Hebrew on iOS, which is the target
   device and costs zero bytes. To bundle Heebo instead, drop the three files
   into vendor/ and uncomment — nothing else needs to change.
@font-face{font-family:Heebo;src:url(vendor/heebo-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Heebo;src:url(vendor/heebo-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Heebo;src:url(vendor/heebo-800.woff2) format("woff2");font-weight:800;font-display:swap}
--------------------------------------------------------------------------- */
:root{color-scheme:light dark;
  --bg:#FAF5EF;--card:#FFFFFF;--sunk:#F2E9DE;--hero:#F5E9DC;
  --ink:#111621;--ink2:#4E5766;--ink3:#667085;
  --line:#EDE2D4;--rail:rgba(17,22,33,.13);
  --accent:#C25A2A;--accent-soft:#FBEDE3;--alert:#B4471F;--alert-soft:#FBE6DA;--ok:#2E7D5B;
  --sh-sm:0 1px 3px rgba(17,22,33,.05),0 4px 14px rgba(17,22,33,.045);
  --sh-md:0 2px 6px rgba(17,22,33,.06),0 12px 30px rgba(17,22,33,.07);
  --r-sm:12px;--r-md:16px;--r-lg:20px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1016;--card:#171C25;--sunk:#1E242F;--hero:#241A13;
  --ink:#EAEEF5;--ink2:#A2ABBA;--ink3:#8C95A6;
  --line:#242B36;--rail:#2E3746;
  --accent:#E08B5C;--accent-soft:#2C1A11;--alert:#E09763;--alert-soft:#2C1A11;--ok:#6FB394;
  --sh-sm:0 1px 3px rgba(0,0,0,.4);--sh-md:0 8px 26px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew",Heebo,"Assistant",system-ui,"Segoe UI",sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--ink)}
.en{direction:ltr;unicode-bidi:isolate}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.xscroll{overflow-x:auto;scrollbar-width:none}
.xscroll::-webkit-scrollbar{display:none}

/* ---- phone-shaped shell --------------------------------------------------
   On the phone this simply fills the screen. On a desktop browser it stays a
   phone-proportioned column on a tinted backdrop rather than stretching a
   mobile layout across 1400px (§1). */
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:760px){
  body{background:var(--hero);display:flex;align-items:center;justify-content:center;padding:24px}
  .app{position:relative;inset:auto;width:440px;height:min(956px,calc(100vh - 48px));
    border-radius:44px;box-shadow:0 30px 80px rgba(17,22,33,.22);border:1px solid var(--line)}
}

/* ---- hero: header + day rail --------------------------------------------- */
.hero{flex:none;background:var(--hero);border-radius:0 0 28px 28px;padding-bottom:4px}
.head{padding:calc(var(--sat) + 18px) 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
@media (min-width:760px){.head{padding-top:26px}}
.head h1{font-size:25px;font-weight:800;line-height:1.15}
.head p{font-size:13px;color:var(--ink2);line-height:1.4;margin-top:4px}
.pill{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--sh-sm);
  border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink2)}
.rail{display:flex;gap:8px;padding:6px 20px 10px}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  width:60px;height:86px;border-radius:var(--r-md);background:var(--card);box-shadow:var(--sh-sm)}
.chip.all{width:64px;gap:2px}
.chip .dw{font-size:10.5px;font-weight:600;opacity:.62;line-height:1.2}
.chip .dn{font-size:19px;font-weight:800;line-height:1.15}
.chip .dt{display:block;width:5px;height:5px;border-radius:50%;margin-top:2px}
.chip .cl{font-size:9.5px;font-weight:700;line-height:1.2;opacity:.68;max-width:56px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* content signature — what the day actually holds */
.sig{display:flex;align-items:center;justify-content:center;gap:2px;height:15px;margin-top:1px}
.sig .sg{display:flex;color:var(--ink2);opacity:.75}
.chip[aria-selected="true"] .sig .sg,.chip.on .sig .sg{opacity:1}
.chip.all .sig{display:none}

/* ---- content -------------------------------------------------------------- */
.body{flex:1;min-height:0;padding:16px 20px 20px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;min-width:0;background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:11px 12px}
.stat .v{display:flex;align-items:center;gap:6px}
.stat .v b{font-size:17px;font-weight:800;line-height:1;color:var(--ink)}
.stat .l{font-size:10.5px;font-weight:600;color:var(--ink3);margin-top:5px}
.mapcard{position:relative;height:196px;border-radius:var(--r-lg);overflow:hidden;background:var(--sunk);
  box-shadow:var(--sh-md);margin-bottom:16px}
#map{position:absolute;inset:0}
#map.mapfail{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
  font-size:12.5px;color:var(--ink2)}
.mapbadge{position:absolute;top:10px;inset-inline-start:10px;z-index:3;display:flex;align-items:center;gap:6px;
  background:var(--card);box-shadow:var(--sh-sm);border-radius:999px;padding:6px 11px;
  font-size:11px;font-weight:700;color:var(--ink2);pointer-events:none}
.mapbadge i{width:7px;height:7px;border-radius:50%}
.note{display:flex;gap:11px;border-radius:var(--r-md);padding:13px 14px;margin-bottom:16px;
  background:var(--card);box-shadow:var(--sh-sm)}
.note.warn{background:var(--alert-soft);box-shadow:none}
.note .lb{font-size:11.5px;font-weight:800;margin-bottom:3px}
.note .tx{font-size:12.5px;line-height:1.55;color:var(--ink2);text-wrap:pretty}

/* ---- timeline ------------------------------------------------------------- */
.row{display:flex;gap:11px;align-items:stretch}
.row .tm{flex:none;width:46px;display:flex;justify-content:flex-end;padding-top:14px;
  font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.row .tr{flex:none;width:30px;display:flex;flex-direction:column;align-items:center}
.row .tr .up,.row .tr .dn{display:block;width:2px;background:var(--rail)}
.row .tr .up{height:10px}
.row .tr .dn{flex:1}
.badge{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--bg)}
.badge.bed{background:var(--card);color:var(--ink2);box-shadow:0 0 0 4px var(--bg),inset 0 0 0 1.5px var(--line)}
.row .bd{flex:1;min-width:0;padding-bottom:12px}
.item{display:flex;gap:11px;align-items:flex-start;background:var(--card);border-radius:var(--r-md);
  padding:13px;box-shadow:var(--sh-sm);cursor:pointer;width:100%;text-align:start}
.item .ic{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.item .nm{font-weight:700;font-size:14.5px;line-height:1.3}
.item .sb{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5;text-wrap:pretty}
.opt{font-size:9.5px;font-weight:700;color:var(--ink3);background:var(--sunk);border-radius:999px;padding:2px 7px}
.leg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 4px 2px;font-size:11.5px;color:var(--ink2)}
.leg .m{display:flex;align-items:center;gap:5px;background:var(--sunk);border-radius:999px;padding:4px 9px;font-weight:700}
.stay{display:flex;align-items:center;gap:11px;background:var(--sunk);border-radius:var(--r-md);padding:13px}
.stay .nm{font-weight:700;font-size:13.5px;line-height:1.35}
.stay .sb{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---- panels (drive legs, the five other screens) -------------------------- */
.panel{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:0 14px}
.panel h3{font-size:11.5px;font-weight:800;color:var(--ink3);padding:12px 0 6px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow .n{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.35}
.prow .v{flex:none;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.grp{margin-bottom:18px}
.grp>h3{font-size:12px;font-weight:800;color:var(--ink3);padding:0 4px 8px}
.grow{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.grow .ld{flex:none;width:32px;height:32px;border-radius:10px;background:var(--sunk);display:flex;
  align-items:center;justify-content:center;font-size:11.5px;font-weight:800}
.grow .nm{font-weight:700;font-size:14px;line-height:1.35;text-wrap:pretty}
.grow .sb{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5;text-wrap:pretty}
a.grow{color:inherit;text-decoration:none;margin-inline:-6px;padding-inline:6px;border-radius:10px}
a.grow:hover,a.grow:active{background:var(--accent-soft);color:inherit}
a.grow:hover .nm{color:var(--accent)}
.extico{display:inline-flex;vertical-align:-1px;margin-inline-start:5px;color:var(--ink3)}
a.grow:hover .extico{color:var(--accent)}
.tone{flex:none;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:2px;white-space:nowrap}
.tone[data-t="ok"]{color:var(--ok);background:rgba(46,125,91,.10)}
.tone[data-t="warn"]{color:var(--alert);background:var(--alert-soft)}
.tone[data-t="todo"],.tone[data-t=""]{color:var(--ink3);background:var(--sunk)}
.foot{font-size:11px;color:var(--ink3);line-height:1.7;padding:4px 4px 0}

/* ---- tab bar -------------------------------------------------------------- */
.tabs{flex:none;padding:8px 8px calc(10px + var(--sab));background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;box-shadow:0 -6px 22px rgba(17,22,33,.05)}
@media (min-width:760px){.tabs{padding-bottom:26px;border-radius:0 0 43px 43px}}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;
  min-width:46px;min-height:46px;color:var(--ink3);font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.tab span{font-size:9.5px;line-height:1.1}

/* ---- overview scan list: all 17 days, grouped by base --------------------- */
.scan{padding:2px 16px 0}
.grp{margin-top:14px}
.ghd{display:flex;align-items:center;gap:7px;padding:0 2px 7px}
.gdot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.gnm{font-size:14.5px;font-weight:800;color:var(--ink)}
.gmt{font-size:11.5px;color:var(--ink3);font-weight:600;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.drow{display:flex;align-items:center;gap:11px;width:100%;text-align:start;background:var(--card);
  border-radius:var(--r-sm);padding:10px 12px;margin-bottom:6px;box-shadow:var(--sh-sm);
  border-inline-start:3px solid var(--c);min-height:56px}
.drow:hover{box-shadow:var(--sh-md)}
.drow .dd{flex:none;display:flex;flex-direction:column;align-items:center;width:30px;line-height:1.1}
.drow .dd b{font-size:17px;font-weight:800}
.drow .dd i{font-size:10px;font-style:normal;font-weight:600;color:var(--ink3)}
.drow .dbd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.drow .dtt{font-size:13.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dmt{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);font-weight:600}
.drow .dmt .sig{height:auto;margin:0}
.drow .dmt .sg{color:var(--c);opacity:.95}
.drow .dwn{flex:none;color:var(--alert);display:flex}

/* ---- settings sheet ------------------------------------------------------- */
.gear{width:34px;height:34px;border-radius:999px;background:var(--card);box-shadow:var(--sh-sm);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.gear:hover{color:var(--accent)}
/* .sheet sets display:flex, and the UA rule [hidden]{display:none} is a LOWER
   priority author-vs-UA match — so the hidden attribute alone does nothing and
   the sheet stayed on screen forever, covering the app. Any element that
   declares its own display must restate [hidden] itself. */
.sheet[hidden],.scrim[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(17,22,33,.34);z-index:90;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;z-index:91;background:var(--card);
  border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(17,22,33,.24);display:flex;flex-direction:column;
  animation:rise .22s cubic-bezier(.2,.8,.3,1)}
@media (min-width:760px){.sheet{border-radius:22px 22px 43px 43px}}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.sheetbar{flex:none;display:flex;justify-content:center;padding:9px 0 2px}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line)}
.sheetbody{flex:1;min-height:0;padding:6px 20px calc(24px + var(--sab))}
.sect{padding:14px 0 4px}
.sect>h4{font-size:12px;font-weight:800;color:var(--ink3);padding-bottom:9px}
.seg{display:flex;gap:6px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink2);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.pals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pal{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:var(--sunk);
  text-align:start;min-height:52px}
.pal[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--accent-soft)}
.pal .dots{display:flex;flex:none}
/* border matches the row background so overlapping dots still read as separate;
   the inset hairline keeps a near-background dot from vanishing in dark mode */
.pal .dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--sunk);
  box-shadow:inset 0 0 0 1px rgba(128,138,155,.38);margin-inline-start:-6px}
.pal[aria-pressed="true"] .dots i{border-color:var(--accent-soft)}
.pal .dots i:first-child{margin:0}
.pal b{font-size:12.5px;font-weight:700;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.fonts{display:flex;flex-direction:column;gap:6px}
.fnt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;
  border-radius:12px;background:var(--sunk);text-align:start;min-height:46px}
.fnt[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--accent-soft)}
.fnt .nm{font-size:14.5px;font-weight:700;line-height:1.25}
.fnt .no{font-size:11px;color:var(--ink3);margin-top:2px}
.fnt .sm{font-size:15px;color:var(--ink2);flex:none}

/* text size — bumps the reading text only, not chrome (§4.4 outdoors in sun) */
[data-size="large"] .item .nm,[data-size="large"] .grow .nm{font-size:15.5px}
[data-size="large"] .item .sb,[data-size="large"] .grow .sb{font-size:13.5px}
[data-size="large"] .prow .n,[data-size="large"] .stay .nm{font-size:14.5px}
[data-size="large"] .note .tx{font-size:14px}
[data-size="large"] .head h1{font-size:26.5px}
[data-size="compact"] .item .nm,[data-size="compact"] .grow .nm{font-size:13.5px}
[data-size="compact"] .item .sb,[data-size="compact"] .grow .sb{font-size:11.5px}

/* ---- map pins ------------------------------------------------------------- */
/* never set position on .pin — MapLibre positions the marker element itself */
.pin{cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.pin i{position:relative;display:flex;width:30px;height:30px;border-radius:50%;background:var(--c,#C25A2A);
  border:2.5px solid #fff;color:#fff;font-weight:700;font-size:13px;font-style:normal;
  align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(10,14,22,.32)}
.pin i::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  border:5px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 2px 2px rgba(10,14,22,.22))}
/* dense days put stops a few hundred metres apart — the selected pin must never
   sit under a neighbour, or the pin↔row pairing breaks */
.pin.on{transform:scale(1.22) translateY(-3px);z-index:5}
.pin.on i{box-shadow:0 6px 16px rgba(10,14,22,.4),0 0 0 5px var(--pinring,rgba(194,90,42,.18))}
.maplibregl-popup-content{font-family:inherit;direction:rtl;font-size:12.5px;font-weight:600;padding:7px 11px;
  border-radius:11px;box-shadow:0 6px 20px rgba(10,14,22,.2);color:#111621}
.maplibregl-ctrl-attrib{font-size:9px}
.maplibregl-ctrl-attrib a{color:#4E5766}
.maplibregl-ctrl-top-left,.maplibregl-ctrl-bottom-left{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="head">
      <div style="min-width:0">
        <h1 id="title">כל הטיול</h1>
        <p id="sub">שש תחנות · 16 לילות · שתי מכוניות</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex:none">
        <span class="pill"><span id="pillico" style="display:flex;opacity:.75"></span><b id="pill">4–20/10</b></span>
        <button id="gear" class="gear" title="תצוגה" aria-label="הגדרות תצוגה"></button>
      </div>
    </div>
    <div class="rail xscroll" id="rail"></div>
  </div>

  <div class="body scroll" id="body"></div>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div id="scrim" class="scrim" hidden></div>
  <section id="sheet" class="sheet" hidden aria-label="הגדרות תצוגה">
    <div class="sheetbar"><span class="grab"></span></div>
    <div class="sheetbody scroll" id="sheetbody"></div>
  </section>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script>
/* ===========================================================================
   DATA — §5 functional contract. Everything below the fold is rendered from
   DAYS: the day chips, the stop rows and the map pins. The number on a pin is
   the number on its list row; keep them derived from the same counter.
   =========================================================================== */
var C = { osaka:"#B85428", kyoto:"#7A4E86", gujo:"#2E7D8A", matsumoto:"#274B8C", fuji:"#4A6FA5", tokyo:"#A03E5C" };
var BASEKEY  = { osaka:"osaka", kyoto:"kyoto", gujo:"gujo", matsumoto:"matsumoto", fuji:"gotemba", tokyo:"tokyo" };
var BASENAME = { osaka:"אוסקה", kyoto:"קיוטו", gujo:"גוג׳ו", matsumoto:"מטסומוטו", fuji:"גוטמבה", tokyo:"טוקיו" };
var HOTEL = {
  osaka:"Meander Osaka · Namba", kyoto:"Miru Kyoto Gion", gujo:"Fairfield Gifu Gujō (Yamato)",
  matsumoto:"Matsumoto Jujo · אמבט פתוח", fuji:"edit×seven Fuji Gotemba", tokyo:"Metropolitan Edmont · Iidabashi"
};
var MODE = { car:"נהיגה", rail:"רכבת", bus:"אוטובוס", walk:"הליכה" };

var DAYS = [
{d:4,dow:"א׳",base:"osaka",t:"נחיתה + ערב ב-Namba",items:[

var PREFS_KEY="jp2026:prefs";

  var d={palette:"persimmon",font:"system",theme:"auto",size:"normal"};
  try{ var s=localStorage.getItem(PREFS_KEY); if(s){ var p=JSON.parse(s);

function isDark(){
  if(prefs.theme==="dark") return true;
  if(prefs.theme==="light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
}
function hexA(hex,a){
  var n=parseInt(hex.slice(1),16);
  return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")";
}
function applyPrefs(){
  var p=PALETTES[prefs.palette]||PALETTES.persimmon, dark=isDark();
  var r=document.documentElement.style, base = dark?DARKBASE:LIGHTBASE;
  var acc = dark ? p.accentDark : p.accent;
  r.setProperty("--bg",   dark?DARKBASE.bg  :p.bg);
  r.setProperty("--card", dark?DARKBASE.card:p.card);
  r.setProperty("--sunk", dark?DARKBASE.sunk:p.sunk);
  r.setProperty("--line", dark?DARKBASE.line:p.line);
  r.setProperty("--hero", dark?p.heroDark   :p.hero);
  r.setProperty("--ink",base.ink); r.setProperty("--ink2",base.ink2);
  r.setProperty("--ink3",base.ink3); r.setProperty("--rail",base.rail);
  r.setProperty("--accent",acc);
  r.setProperty("--accent-soft", dark ? hexA(acc,.16) : hexA(acc,.10));
  r.setProperty("--iconbg", dark ? "rgba(255,255,255,.07)" : "rgba(17,22,33,.05)");
  r.setProperty("--pinring", hexA(acc,.18));
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
  document.body.style.fontFamily = (FONTS[prefs.font]||FONTS.system).stack;
  document.documentElement.setAttribute("data-size", prefs.size);
  var tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute("content", dark?p.heroDark:p.hero);
  wantDark = dark;
  syncBasemap();
}
/* The basemap follows the theme. Requests that land while a style is still
   loading are REMEMBERED (wantDark), not dropped — style.load calls back in
   here, so the last-requested theme always wins. Guarding on styleReady alone
   silently lost the tap and left the map frozen: drawNow() early-returns on
   !styleReady, so day changes stopped updating pins while the list kept going,
   which quietly breaks the pin↔row contract (§5). */
function syncBasemap(){
  if(!map || map.__loading) return;
  if(map.__dark === wantDark) return;
  map.__dark = wantDark;
  styleReady = false; map.__loading = true;
  try{
    /* diff:false forces a full style reload so "style.load" fires again. With
       the default diff, MapLibre patches the running style in place and emits
       only styledata — the map would never report ready again. */
    map.setStyle(wantDark ? "data/style-liberty-dark.json" : "data/style-liberty-latin.json", {diff:false});
    /* the map going permanently blank is the worst outcome on a trip with no
       signal — if the swap never reports back, recover rather than stay frozen */
    clearTimeout(map.__watchdog);
    map.__watchdog = setTimeout(function(){ if(!styleReady) onStyleReady(); }, 3000);
  }catch(e){ map.__loading=false; console.warn("style swap failed:", e && e.message); }
}

   Every stop in DAYS carries an explicit c:"…". These drive both the icon on the
   stop card and the content signature on each day chip, so you can tell what a

  sight: {i:I.torii,   l:"אתרים"}, food: {i:I.bowl, l:"אוכל"},

  stay:  {i:I.bed,     l:"לינה"}
};
/* most characteristic first; "stay" is excluded — every day ends somewhere */
var SIG_PRIO = ["nature","water","sight","food","town","shop","cafe","walk","drive","rail","bus","air"];

function dayKm(day){
  if(!R) return 0;
  return day.items.reduce(function(a,it){ return a+(it.drive&&R.drives[it.drive]?R.drives[it.drive].km:0); },0);
}
function dayHrs(day){
  if(!R) return 0;
  return day.items.reduce(function(a,it){ return a+(it.drive&&R.drives[it.drive]?R.drives[it.drive].hrs:0); },0);
}
/* up to 3 categories describing the day. A long transfer leads, because on those
   days the driving is the day. */
function daySig(day){
  var have={};
  day.items.forEach(function(it){ if(it.c) have[it.c]=1; });
  if(dayKm(day)>60) have.drive=1;
  var order=SIG_PRIO.slice();
  if(dayKm(day)>100) order=["drive"].concat(order.filter(function(c){return c!=="drive";}));
  var out=[];
  order.forEach(function(c){ if(have[c]&&out.length<3) out.push(c); });
  return out;
}
function sigHtml(day,size){
  return daySig(day).map(function(c){
    return '<span class="sg" title="'+CAT[c].l+'">'+svg(CAT[c].i,size||12)+'</span>';
  }).join("");
}

function initMap(){
  try{
    if(typeof maplibregl==="undefined") throw new Error("MapLibre failed to load");
    /* isDark(), not the raw media query — the map must be built with the SAVED
       theme, otherwise it starts opposite to the UI and needs a needless swap */
    var dark = isDark();
    map = new maplibregl.Map({
      container:mapNode(),
      style: dark ? "data/style-liberty-dark.json" : "data/style-liberty-latin.json",
      center:[137.9,36.3], zoom:4.6,
      attributionControl:{compact:true,
        customAttribution:'<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>'}
    });
    /* record the theme the map was BUILT with. Without this the first
       applyPrefs() sees undefined!==dark and fires a redundant setStyle(),
       which drops styleReady and opens the race below. */
    map.__dark = dark; wantDark = dark;
    map.scrollZoom.disable(); map.dragRotate.disable(); map.touchZoomRotate.disableRotation();
    map.on("error", function(e){
      var m = e && e.error && e.error.message || "";
      /* the dark style is optional — fall back rather than showing a blank map */
      if(/style-liberty-dark/.test(m) && !map.__fellBack){ map.__fellBack=1; map.setStyle("data/style-liberty-latin.json"); }
      else console.warn("map:", m);
    });
    /* "style.load", not "load": load waits on tiles and never fires offline.
       Theme swaps below use setStyle(url,{diff:false}) precisely so this fires
       again — a diff-based setStyle emits only styledata, which left styleReady
       false forever and froze the map on the previous day's pins (breaks §5). */
    map.on("style.load", onStyleReady);
    if(window.ResizeObserver){
      /* resize only — applyFit() already retries until the box has a real size */
      var ro=new ResizeObserver(function(){ clearTimeout(map.__rz); map.__rz=setTimeout(function(){ if(map) map.resize(); },120); });
      ro.observe(mapNode());
    }
    mapReady = true;
  }catch(err){
    console.warn("map init failed:", err);
    var el=mapNode(); el.className="mapfail"; el.textContent="המפה לא נטענה — התוכנית עובדת כרגיל.";
  }
}
function onStyleReady(){
  styleReady=true; map.__loading=false;

  addRouteLayers(); draw();
  /* a theme tap that landed mid-load was deferred, not dropped — apply it now */
  syncBasemap();
}
function addRouteLayers(){
  if(!map || map.getSource("routes")) return;
  map.addSource("routes",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  /* the dashed legs are deliberately straight — they mark a rail connection,
     not a road geometry. Do not "fix" them into routed lines (§6). */
  map.addLayer({id:"routes-dash",type:"line",source:"routes",filter:["==",["get","dash"],true],
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["get","color"],"line-width":2.4,"line-opacity":.8,"line-dasharray":[2,2]}});
  map.addLayer({id:"routes-solid",type:"line",source:"routes",filter:["!=",["get","dash"],true],
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["get","color"],"line-width":4.5,"line-opacity":.9}});
}
function lineF(pts,color,dash){
  return {type:"Feature",properties:{color:color,dash:!!dash},
    geometry:{type:"LineString",coordinates:pts.map(function(p){return [p[1],p[0]];})}};
}
function setRoutes(f){ var s=map&&map.getSource("routes"); if(s)s.setData({type:"FeatureCollection",features:f}); }
function clearPins(){ markers.forEach(function(m){m.remove();}); markers=[]; pinEls={}; }
function addPin(ll,label,color,popup,key){
  var el=document.createElement("div"); el.className="pin";
  el.innerHTML='<i style="--c:'+color+'">'+label+'</i>';
  if(key){ el.dataset.jump=key; el.addEventListener("click",function(){ selectStop(key,true); }); pinEls[key]=el; }
  var m=new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([ll[1],ll[0]]);
  if(popup) m.setPopup(new maplibregl.Popup({offset:22,closeButton:false}).setHTML(popup));
  m.addTo(map); markers.push(m);
}
function fit(pts,maxZoom){ if(!pts.length||!map) return; want={pts:pts,z:maxZoom}; applyFit(); }
function applyFit(){
  if(!want||!map) return;
  var w=want;
  doFit(w);
  /* One confirmation pass per target. The map node is moved into a freshly
     rendered .mapslot on every day change, so at first-fit time the container
     can still be settling and fitBounds computes against a stale transform —
     which showed up as an under-zoomed, one-interaction-behind camera.
     Re-fitting on the next idle converges. Idempotent: it re-reads the SAME
     target and bails if the user has since picked another view. */
  if(!w.confirmed){
    w.confirmed=true;
    /* plain timers, NOT map.once("idle") — "idle" waits for tiles to finish
       loading, so on a slow or offline connection it never fires and the
       correction never runs. Same trap as "load" vs "style.load". */
    setTimeout(function(){ if(want===w) doFit(w); },160);
  }
}
function doFit(w){
  var el=map.getContainer(), cw=el?el.clientWidth:0, ch=el?el.clientHeight:0;
  if(cw<40||ch<40){ clearTimeout(applyFit.t); applyFit.t=setTimeout(applyFit,260); return; }
  var b=new maplibregl.LngLatBounds();
  w.pts.forEach(function(p){ b.extend([p[1],p[0]]); });
  if(!b.getNorthEast()||!b.getSouthWest()) return;
  var p={top:34,bottom:30,left:28,right:28};
  if(p.left+p.right>=cw-20||p.top+p.bottom>=ch-20) p={top:8,bottom:8,left:8,right:8};
  /* resize before measuring: fitBounds works off the map's internal transform
     size, not the live DOM box. */
  map.resize();
  /* duration:0 — fitBounds' easing runs on requestAnimationFrame, which does not
     tick in a hidden or throttled tab, so an animated fit can silently never
     reach its target and leave every pin stacked on one point. */
  try{ map.fitBounds(b,{padding:p,maxZoom:maxZoom(w.z),duration:0}); }
  catch(e){ console.warn("fit skipped:", e && e.message); }
  syncMarkers();
}
/* Markers compute their screen position inside addTo(), from whatever the
   camera is at that moment — no render frame required. So the camera must be
   fitted BEFORE the pins are added; see drawNow(). This helper only exists for
   the flyTo case, where the camera moves after the pins already exist. */
function syncMarkers(){
  if(!map) return;
  markers.forEach(function(mk){ try{ mk.setLngLat(mk.getLngLat()); }catch(e){} });
}
function maxZoom(z){ return z||14; }
function syncPins(){ for(var k in pinEls){ pinEls[k].classList.toggle("on", k===active); } }

function draw(){ clearTimeout(draw.t); draw.t=setTimeout(function(){ try{ drawNow(); }catch(e){ console.warn("map draw failed:", e && e.message); } },0); }
function drawNow(){
  if(!map||!styleReady||!R) return;
  clearPins();
  if(tab!=="route"){ setRoutes([]); return; }
  /* ORDER MATTERS: collect the points, fit the camera, and only THEN add the
     pins. A Marker positions itself during addTo() using the current camera,
     so pins added after the fit are correct on the spot. Adding them first and
     fitting after leaves them painted at the previous view's position until
     MapLibre's next render frame — which is rAF-driven and can be seconds away
     in a throttled tab. */
  var queue=[];
  if(sel==="all"){
    var feats=[];
    ["kyoto_gujo","gujo_matsumoto","matsumoto_gotemba"].forEach(function(id){ if(R.drives[id]) feats.push(lineF(R.drives[id].line,"#C25A2A")); });
    [["osaka","kyoto"],["gotemba","tokyo"]].forEach(function(p){
      if(R.coords[p[0]]&&R.coords[p[1]]) feats.push(lineF([R.coords[p[0]],R.coords[p[1]]],"#8B8578",true)); });
    setRoutes(feats);
    var pts=[];
    NIGHTS.forEach(function(b,i){
      var key=BASEKEY[b[0]]||b[0];
      if(!R.coords[key]) return;
      queue.push([R.coords[key], i+1, C[b[0]], "<b>"+(i+1)+" · "+esc(b[1])+"</b>", key]);
      pts.push(R.coords[key]);
    });
    fit(pts,8.2);
  }else{
    var day=DAYS[sel], c=C[day.base], n=0, dpts=[], df=[];
    day.items.forEach(function(it){
      if(it.drive&&R.drives[it.drive]){ df.push(lineF(R.drives[it.drive].line,c)); R.drives[it.drive].line.forEach(function(p){dpts.push(p);}); }
    });
    setRoutes(df);
    day.items.forEach(function(it){
      if(!it.k||!R.coords[it.k]) return;
      n++;                                     /* same counter as the list row */
      queue.push([R.coords[it.k], n, c, "<b>"+esc(it.n)+"</b>", it.k]);
      dpts.push(R.coords[it.k]);
    });
    fit(dpts,13);
  }
  queue.forEach(function(a){ addPin(a[0],a[1],a[2],a[3],a[4]); });
  syncPins();
}

/* ---- pin ⟷ row pairing ---------------------------------------------------- */
function selectStop(key, fromMap){
  if(!key) return;
  active=key; syncPins(); markActive();
  try{
    if(R&&R.coords[key]&&map)
      map.flyTo({center:[R.coords[key][1],R.coords[key][0]], zoom:Math.max(map.getZoom(),12), duration:camDur(700)});
      map.once("moveend", syncMarkers);
  }catch(e){ console.warn("flyTo skipped:", e && e.message); }
  if(fromMap){
    var sc=$("#body"), el=sc.querySelector('.item[data-jump="'+key+'"]');
    if(el){
      var scr=sc.getBoundingClientRect(), r=el.getBoundingClientRect(), sh=sc.clientHeight;
      /* already fully in view — don't yank the list under the user */
      if(r.top < scr.top || r.bottom > scr.bottom){
        /* Offsets are derived from the live scroller, never hardcoded: .app is
           height:min(956px, 100vh - 48px), so on a short window this box can be
           ~200px tall and a fixed 200px offset would push the row you just
           asked for straight off the bottom. Cap the padding so the row's
           BOTTOM always lands inside the visible area. */
        var pad = Math.min(200, sh * 0.25, sh - r.height - 8);
        if(pad < 8) pad = 8;
        suppress = true;
        /* behavior:"smooth" is a silent no-op on this scroller — assign scrollTop */
        sc.scrollTop += (r.top - scr.top - pad);
        setTimeout(function(){ suppress=false; },400);
      }
    }
  }
}
function camDur(ms){
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  return (document.hidden || reduce) ? 0 : ms;
}
function markActive(){
  var c = sel==="all" ? null : C[DAYS[sel].base];
  [].forEach.call(document.querySelectorAll('.item[data-jump]'), function(el){
    var on = el.dataset.jump===active;
    var col = c || C[el.dataset.base] || "var(--accent)";
    el.style.boxShadow = on ? "0 0 0 2px "+col+", var(--sh-md)" : "var(--sh-sm)";
  });
}
function onScroll(){
  var sc=$("#body"); if(!sc||suppress||tab!=="route") return;
  clearTimeout(onScroll.t);
  onScroll.t=setTimeout(function(){
    var items=[].slice.call(sc.querySelectorAll('.item[data-jump]'));
    if(!items.length) return;
    /* proportional, so the anchor line always sits INSIDE the scroller — a flat
       240px falls below the bottom edge of a short box and highlights a pin for
       a row the user cannot see */
    var anchor=sc.getBoundingClientRect().top + Math.min(240, sc.clientHeight*0.35),
        best=null, bd=Infinity;
    items.forEach(function(el){ var d=Math.abs(el.getBoundingClientRect().top-anchor); if(d<bd){bd=d;best=el;} });
    var k=best&&best.dataset.jump;
    if(k&&k!==active){ active=k; syncPins(); markActive(); }
  },80);
}

        legText = fmt(lg.hrs) + (lg.km?" · "+lg.km+" ק״מ":"");
        var fromK = i>0 ? (day.items[i-1]||{}).k : BASEKEY[day.base];
        if(R&&it.k&&fromK&&R.coords[it.k]&&R.coords[fromK])
          legUrl="https://www.google.com/maps/dir/"+R.coords[fromK]+"/"+R.coords[it.k];
      }
      if(it.k) n++;                            /* same counter as the map pin */
      h+=timelineRow({num: it.k?String(n):"·", name:it.n, sub:esc(it.s), time:it.t||"",
        /* explicit category first; the prose-matching rules stay only as a fallback */
        opt:!!it.opt, jump:it.k||"", icon:(it.c&&CAT[it.c]?CAT[it.c].i:iconFor(it.n+" "+it.s)),
        color: it.k?col:"var(--ink3)", first:i===0,
        leg:!!lg, legIcon: lg?(LEG_ICON[lg.mode]||I.car):"", legText:legText, legTo: lg&&lg.txt?lg.txt:"", legUrl:legUrl});
    });
    h+='<div class="row"><div class="tm"></div>'
      +'<div class="tr"><span class="up"></span><span class="badge bed">'+svg(I.bed,15)+'</span></div>'
      +'<div class="bd"><div class="stay"><div style="flex:1;min-width:0">'
      +'<div class="nm">'+esc(HOTEL[day.base])+'</div><div class="sb">לינה</div></div></div></div></div>';
  }
  return h;
}
function renderScreen(){
  var s=SCREENS[tab]; if(!s) return "";
  var h="";
  if(s.note){
    h+='<div class="note" style="background:var(--accent-soft);box-shadow:none">'
      +'<span style="color:var(--accent);flex:none;margin-top:1px">'+svg(I.info,17)+'</span>'
      +'<div class="tx" style="flex:1;min-width:0">'+esc(s.note)+'</div></div>';
  }
  s.groups.forEach(function(g){
    h+='<div class="grp"><h3>'+esc(g.label)+'</h3><div class="panel">';
    g.rows.forEach(function(r){
      var lead = r.icon ? '<span style="color:var(--accent)">'+svg(I[r.icon]||I.pin,17)+'</span>' : esc(r.lead||"");
      /* recommendations are links — tapping one opens it in Google Maps */
      var link = tab==="recs";
      var tag  = link ? 'a' : 'div';
      var attr = link ? ' class="grow link" href="'+esc(mapsUrl(r))+'" target="_blank" rel="noopener"' : ' class="grow"';
      h+='<'+tag+attr+'><span class="ld">'+lead+'</span>'
        +'<div style="flex:1;min-width:0"><div class="nm">'+esc(r.name)
        +(link?'<span class="extico">'+svg(I.ext,12)+'</span>':"")+'</div>'
        +(r.sub?'<div class="sb">'+esc(r.sub)+'</div>':"")+'</div>'
        +(r.meta?'<span class="tone" data-t="'+esc(r.tone||"")+'">'+esc(r.meta)+'</span>':"")+'</'+tag+'>';
    });
    h+='</div></div>';
  });
  return h+'<div class="foot">תוכן לדוגמה — המסך הזה עדיין חי באפליקציה הלא-מקוונת ויועבר לכאן.</div>';
}
/* The pill must earn its place: never repeat the h1. Each screen reports a
   number the title cannot — open items, places to decide, how many spots. */
function screenPill(key){
  var s=SCREENS[key], rows=[];
  s.groups.forEach(function(g){ rows=rows.concat(g.rows); });
  var open = rows.filter(function(r){ return r.tone && r.tone!=="ok"; }).length;
  if(key==="book")    return [open ? open+" פתוחים" : "הכל מאושר", I.ticket];
  if(key==="weather") return [rows.filter(function(r){return r.tone==="warn";}).length+" להחליט", I.cloud];
  if(key==="lists")   return [open ? open+" פתוחים" : "הכל מוכן", I.check];
  if(key==="recs")    return [rows.length+" מקומות", I.star];
  return [s.kicker, I.cal];
}
function render(){
  var isRoute = tab==="route";
  $("#rail").parentNode.style.display="";
  $("#rail").style.display = isRoute ? "" : "none";
  if(isRoute){
    $("#pillico").innerHTML=svg(I.cal,14,' style="stroke-width:2"');
    if(sel==="all"){ $("#title").textContent="כל הטיול"; $("#sub").textContent="שש תחנות · 16 לילות · שתי מכוניות"; $("#pill").textContent="4–20/10"; }
    else{ var d=DAYS[sel]; $("#title").textContent=d.t;
      $("#sub").textContent=d.dow+" · "+d.d+" באוקטובר · לינה ב"+BASENAME[d.base]; $("#pill").textContent=d.d+"/10"; }
  }else{
    var s=SCREENS[tab], pl=screenPill(tab);
    $("#title").textContent=s.title; $("#sub").textContent=s.meta;
    $("#pill").textContent=pl[0]; $("#pillico").innerHTML=svg(pl[1],14,' style="stroke-width:2"');
  }
  document.documentElement.style.setProperty("--iconbg",
    window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches ? "rgba(255,255,255,.07)" : "rgba(17,22,33,.05)");
  $("#body").innerHTML = isRoute ? renderRoute() : renderScreen();
  if(isRoute){
    [].forEach.call($("#body").querySelectorAll('.item[data-jump]'), function(el){
      el.addEventListener("click", function(){ selectStop(el.dataset.jump); });
    });
    /* overview scan rows jump straight into that day */
    [].forEach.call($("#body").querySelectorAll('.drow[data-day]'), function(el){
      el.addEventListener("click", function(){
        sel=+el.dataset.day; active=null; render(); draw(); $("#body").scrollTop=0;
      });
    });
    /* ONE map instance for the life of the page. The route markup is re-rendered
       on every day change, so the map lives in a detached node that gets moved
       into the fresh .mapslot rather than torn down and rebuilt each time. */
    var slot=$("#body").querySelector(".mapslot");
    if(slot){ slot.parentNode.replaceChild(mapNode(), slot); if(!map) initMap(); else map.resize(); }
    markActive();
  }
  paintRail();
  renderTabs();
}

/* ---- settings sheet ------------------------------------------------------- */
function segRow(name,opts,cur){
  return '<div class="seg">'+opts.map(function(o){
    return '<button data-set="'+name+'" data-val="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+esc(o[1])+'</button>';
  }).join("")+'</div>';
}
function renderSheet(){
  var h='<div class="sect"><h4>ערכת צבע</h4><div class="pals">';
  Object.keys(PALETTES).forEach(function(k){
    var p=PALETTES[k], dark=isDark();
    h+='<button class="pal" data-set="palette" data-val="'+k+'" aria-pressed="'+(prefs.palette===k)+'">'
      +'<span class="dots"><i style="background:'+(dark?p.accentDark:p.accent)+'"></i>'
      +'<i style="background:'+(dark?p.heroDark:p.hero)+'"></i>'
      +(dark?"":'<i style="background:'+p.bg+'"></i>')+'</span>'
      +'<b>'+esc(p.label)+'</b></button>';
  });
  h+='</div></div>';

  h+='<div class="sect"><h4>גופן</h4><div class="fonts">';
  Object.keys(FONTS).forEach(function(k){
    var f=FONTS[k];
    h+='<button class="fnt" data-set="font" data-val="'+k+'" aria-pressed="'+(prefs.font===k)+'">'
      +'<span style="min-width:0"><span class="nm" style="font-family:'+f.stack.replace(/"/g,"&quot;")+'">'+esc(f.label)+'</span>'
      +'<span class="no" style="display:block">'+esc(f.note)+'</span></span>'
      +'<span class="sm" style="font-family:'+f.stack.replace(/"/g,"&quot;")+'">אבג · 12/10</span></button>';
  });
  h+='</div></div>';

  h+='<div class="sect"><h4>מצב תצוגה</h4>'
    +segRow("theme",[["light","בהיר"],["dark","כהה"],["auto","לפי המכשיר"]],prefs.theme)+'</div>';
  h+='<div class="sect"><h4>גודל טקסט</h4>'
    +segRow("size",[["compact","קטן"],["normal","רגיל"],["large","גדול"]],prefs.size)+'</div>';
  h+='<div class="foot" style="padding-top:14px">כל הגופנים חוץ מ-Heebo מותקנים כבר במכשיר — מעבר ביניהם לא מוריד כלום. ההעדפות נשמרות במכשיר.</div>';

  $("#sheetbody").innerHTML=h;
  [].forEach.call($("#sheetbody").querySelectorAll("[data-set]"), function(b){
    b.addEventListener("click", function(){
      prefs[b.dataset.set]=b.dataset.val; savePrefs(); applyPrefs(); renderSheet();
      if(b.dataset.set==="size") render();
    });
  });
}
function openSheet(){ $("#scrim").hidden=false; $("#sheet").hidden=false; renderSheet(); }
function closeSheet(){ $("#scrim").hidden=true; $("#sheet").hidden=true; }

/* ---- boot ----------------------------------------------------------------- */
$("#gear").innerHTML=svg("M12 15.4a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"
  +"M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.6 15a1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6h.07A1.6 1.6 0 0 0 10 3.13V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 19.4 9v.07a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z",17);
$("#gear").addEventListener("click", openSheet);
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

applyPrefs();
renderRail();
render();
$("#body").addEventListener("scroll", onScroll);
fetch("data/route.json").then(function(r){ return r.json(); }).then(function(j){ R=j; render(); draw(); })
  .catch(function(e){ console.warn("route data failed:", e); });
</script>
