<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>יפן 2026</title>
<!-- Home-screen install. black-translucent puts the status bar over our header,
     which already pads for safe-area-inset-top, and the header is always a dark
     or saturated colour so the white status text stays legible. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יפן 2026">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Timetable redesign. Fonts are bundled in vendor/fonts, not fetched from Google —
   this gets used on mobile data in rural Japan, so nothing external can stall.
   The Hebrew subsets are 7–18 KB each, which is what actually loads here. */
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
:root{
  --page:#E9E2D6;--bg:#F7F3EC;--card:#FFFDFA;--line:#E7E0D3;--line2:#DCD3C4;
  --ink:#14181F;--ink2:#5C6371;--ink3:#8A9099;--ink4:#9AA0A9;
  --acc:#274B8C;--ok:#2E7D5B;--warn:#B4471F;--warnbg:#FBEADF;--warnbd:#F0D6C4;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--fs:1;
  /* header for the non-day screens: must stay dark in BOTH themes, the header
     text is always white. Using --ink here goes white-on-white in dark mode. */
  --headneutral:#14181F;
}
:root[data-t="dark"]{
  --page:#0A0C10;--bg:#14181F;--card:#1B212B;--line:#252C38;--line2:#2E3644;
  --ink:#EDF0F5;--ink2:#A8B0BD;--ink3:#7E8695;--ink4:#6E7686;
  --acc:#8FB0EA;--ok:#5FB68C;--warn:#E8845A;--warnbg:#2A1B13;--warnbd:#3A2619;--headneutral:#252C38;
}
/* Assistant throughout — bundled in vendor/fonts, Hebrew subset first. */
:root{--title:"Assistant",-apple-system,"SF Hebrew",system-ui,sans-serif}
body{background:var(--bg);display:flex;align-items:stretch;justify-content:center;padding:0;
  font-family:"Assistant",-apple-system,"SF Hebrew",system-ui,sans-serif;line-height:1.4;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;color:var(--ink)}
@media(min-width:760px){body{background:var(--page);padding:24px;align-items:center}}
h1,h2,h3,h4,p{margin:0}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.en{direction:ltr;unicode-bidi:isolate}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.xscroll{overflow-x:auto;scrollbar-width:none}
.xscroll::-webkit-scrollbar{display:none}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.maplibregl-ctrl-attrib{font-size:8.5px;background:color-mix(in srgb,var(--bg) 78%,transparent);max-width:118px;color:var(--ink3);line-height:1.25}
.maplibregl-ctrl-attrib a{color:var(--ink3)}
.maplibregl-ctrl-top-left,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-top-right{display:none}

#app{position:fixed;top:0;left:0;right:0;height:100svh;height:100dvh;max-width:none;
  display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media(min-width:760px){#app{position:relative;inset:auto;width:100%;max-width:440px;height:min(940px,calc(100vh - 48px));min-height:720px;border-radius:46px;
  box-shadow:0 30px 90px rgba(20,24,31,.26);border:1px solid var(--line2)}}

header{flex:none;color:#fff;padding:calc(var(--sat) + 10px) 20px 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dateline{font-size:calc(13px*var(--fs));font-weight:600;opacity:.85}
.iconbtn{flex:none;width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;color:#fff}
header h1{font-family:var(--title);font-size:calc(27px*var(--fs));font-weight:800;line-height:1.18;
  letter-spacing:-.2px;margin-top:6px}
header .sub{font-size:calc(13.5px*var(--fs));font-weight:500;opacity:.82;margin-top:2px}
.pager{display:flex;gap:4px;margin:9px -20px 0;padding:0 20px 8px}
.pg{flex:none;width:40px;height:46px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px}
.pg .w{font-size:10px;font-weight:600}
.pg .d{font-size:16.5px;font-weight:800;line-height:1}
.subrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:2px}
.subrow .sub{margin-top:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx{flex:none;display:flex;align-items:center;gap:6px;opacity:.95}
.wx svg{opacity:.9}
.wx .hi{font-size:calc(15px*var(--fs));font-weight:800;line-height:1}
.wx .lo{font-size:calc(11.5px*var(--fs));font-weight:600;opacity:.72}
.wx .rain{display:flex;align-items:center;gap:3px;font-size:calc(11px*var(--fs));font-weight:700;opacity:.8}
/* whether these numbers are a real forecast or an October climate average is the
   one thing you must not lose by shrinking the band */
.wx .src{font-size:9.5px;font-weight:600;opacity:.62}
.wxbar .tx{flex:1;min-width:0;font-size:calc(11px*var(--fs));font-weight:500;opacity:.8;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wxbar .rain{flex:none;display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;
  background:rgba(255,255,255,.16);font-size:11px;font-weight:700}

.strip{flex:none;position:relative;height:min(170px,26vh);min-height:96px;background:var(--line)}
/* The day screen has no map any more — this slim row carries what the strip used
   to say, plus the one link that does the job better than an embedded map did. */
.dayline{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.dayline .cnt{font-size:calc(11.5px*var(--fs));font-weight:700;color:var(--ink3)}
.gmaps{display:inline-flex;align-items:center;gap:6px;flex:none;height:30px;padding:0 12px;
  border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  font-size:calc(11.5px*var(--fs));font-weight:700}
.stripmeta{position:absolute;top:10px;inset-inline-start:12px;background:var(--bg);border-radius:7px;
  padding:4px 9px;font-size:10.5px;font-weight:700;color:var(--ink2);pointer-events:none;z-index:2}
.grab{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);height:28px;padding:0 12px;
  display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink2);
  touch-action:none;z-index:3;background:var(--bg);border-radius:999px;box-shadow:0 1px 6px rgba(20,24,31,.18);
  white-space:nowrap}

main{flex:1;min-height:0;touch-action:pan-y}
/* content settles in on every screen/day change; press states give buttons weight */
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#app[data-moved="1"] #body>*{animation:rise .34s cubic-bezier(.22,.61,.36,1) both}
.stop,.prow,.pg,.chips button,nav button,.gbtn,.vars button{transition:transform .16s cubic-bezier(.22,.61,.36,1),opacity .16s ease}
.stop:active,.prow:active,.gbtn:active,.vars button:active{transform:scale(.985);opacity:.9}
.pg:active,nav button:active,.chips button:active{transform:scale(.92)}
nav button svg,nav button span{transition:color .16s ease}
#app[data-moved="1"] nav button[data-on="1"] svg{animation:pop .34s cubic-bezier(.22,.61,.36,1)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.stop .cv{transition:transform .2s cubic-bezier(.2,.8,.3,1)}
@media (prefers-reduced-motion:reduce){#app[data-moved="1"] #body>*,#app[data-moved="1"] nav button[data-on="1"] svg{animation:none}}
.hint{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--ink3)}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vars button{flex:1 1 30%;min-width:0;padding:9px 8px;border-radius:10px;border:1px solid var(--line2)}
.vars .l{display:block;font-size:calc(12.5px*var(--fs));font-weight:700;line-height:1.2;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vars .c{display:block;font-size:10px;font-weight:600;opacity:.7;margin-top:3px}
.note{margin:12px 20px 0;display:flex;gap:9px;padding:14px 15px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.note.warn{background:var(--warnbg);border-color:var(--warnbd)}
.note .tx{font-size:calc(12px*var(--fs));font-weight:500;line-height:1.5;color:var(--ink2)}
.note.warn .tx{color:var(--warn)}

.stops{padding:10px 20px 0}
.leg{display:flex;align-items:center;gap:10px;padding:1px 0}
.leg .sp{flex:none;width:44px}
.leg .ln{flex:none;width:24px;display:flex;justify-content:center}
.leg .ln i{width:0;height:22px;border-inline-start:2px dashed var(--c);opacity:.55;display:block}
.leg .tx{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink3)}
.stop{display:flex;align-items:stretch;gap:10px;width:100%;padding:0}
.stop .tm{flex:none;width:44px;padding-top:11px;font-size:calc(11.5px*var(--fs));font-weight:700;text-align:end}
.stop .rail{flex:none;width:24px;display:flex;flex-direction:column;align-items:center}
.stop .rail .up{width:0;height:9px;border-inline-start:1px solid var(--line2)}
.stop .rail .dn{width:0;flex:1;border-inline-start:1px solid var(--line2)}
.stop .num{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;border:1.5px solid var(--c)}
.stop .bd{flex:1;min-width:0;padding:12px 0 13px;border-bottom:1px solid var(--line)}
.stop .top{display:flex;align-items:baseline;gap:7px}
.stop .nm{flex:1;min-width:0;font-size:calc(15px*var(--fs));font-weight:700;line-height:1.3}
.stop .opt{flex:none;font-size:9.5px;font-weight:700;color:var(--ink3);border:1px solid var(--line2);
  border-radius:999px;padding:1px 7px}
.stop .cv{flex:none;color:var(--ink4);display:flex;transition:transform .18s}
/* Carries the day's colour so it reads as an action, next to the grey chevron
   which only opens the row. */
.stop .pinbtn{flex:none;display:flex;align-self:center;padding:3px;margin-inline-start:1px;
  border-radius:7px;opacity:.75}
.stop .sub{font-size:calc(12px*var(--fs));font-weight:500;color:var(--ink3);margin-top:2px}
.stop.open .sub{font-size:calc(13px*var(--fs));line-height:1.55;color:var(--ink2)}
.acts{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.gbtn{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;
  background:var(--acc);color:#fff;font-size:11.5px;font-weight:700}
:root[data-t="dark"] .gbtn{color:#0A0C10}
.cat{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line2);font-size:11.5px;font-weight:700;color:var(--ink2)}
.hotel{display:flex;align-items:stretch;gap:10px}
.hotel .nm{display:block;font-size:calc(13.5px*var(--fs));font-weight:700;line-height:1.35}
.hotel .mt{display:block;font-size:calc(11.5px*var(--fs));font-weight:600;color:var(--ink3);margin-top:2px}

.sect{font-family:var(--title);font-size:calc(15px*var(--fs));font-weight:800;color:var(--ink2);
  letter-spacing:0;padding:2px 0 8px;line-height:1.3}
.sect+.card{margin-top:0}
.card+.sect{padding-top:10px}
.prow{display:flex;align-items:flex-start;gap:11px;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.prow .nm{display:block;font-size:calc(14px*var(--fs));font-weight:600;line-height:1.35}
.prow .sub{display:block;font-size:calc(12px*var(--fs));font-weight:500;color:var(--ink4);margin-top:2px;line-height:1.45}
.prow .mt{flex:none;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:1px;white-space:nowrap}
.box{flex:none;width:20px;height:20px;margin-top:1px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;border:1.5px solid var(--line2);color:#fff}
.ricon{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);color:var(--ink3)}
.subtabs{display:flex;gap:6px;padding-bottom:14px}
.subtabs button{flex:1;padding:9px 6px;border-radius:10px;font-size:calc(12.5px*var(--fs));font-weight:700;
  border:1px solid var(--line2);text-align:center}

nav{flex:none;display:flex;padding:5px 10px calc(8px + var(--sab));background:var(--bg);border-top:1px solid var(--line)}
@media(max-width:759px){
  /* glue it to the viewport bottom rather than trusting the shell height */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30}
  main{padding-bottom:var(--navh,74px)}
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:46px;
  position:relative}
nav button[data-on="1"]::before{content:"";position:absolute;top:0;width:26px;height:2.5px;
  border-radius:0 0 3px 3px;background:#C25A2A}
nav span{font-size:10px}

.sheetwrap{position:absolute;inset:0;z-index:90}
.scrim{position:absolute;inset:0;background:rgba(20,24,31,.32)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;
  box-shadow:0 -12px 44px rgba(20,24,31,.22);padding:10px 22px calc(30px + var(--sab))}
@media(min-width:760px){.sheet{border-radius:24px 24px 45px 45px}}
.grip{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.seg{display:flex;gap:6px;border:1px solid var(--line2);border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:calc(12.5px*var(--fs));font-weight:700;text-align:center}
.mapfull{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg)}
@media(min-width:760px){.mapfull{border-radius:46px;overflow:hidden}}
.chips{flex:none;display:flex;gap:7px;padding:12px 22px calc(20px + var(--sab));border-top:1px solid var(--line)}
.chips button{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line2);font-size:12px;font-weight:700}
.chips .n{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#fff}
.pinin{transition:transform .18s cubic-bezier(.2,.8,.3,1);transform-origin:center}
.fail{padding:16px;text-align:center;font-size:12px;color:var(--ink3)}

/* ---- Cards: the airier treatment borrowed from Onward's "Essentials" screen.
   Roomier than the .prow lists on purpose — these are things you read once and
   act on, not a dense timeline you scan. ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin-bottom:12px}
.card.inset{margin:12px 20px 0}
/* A card that holds a run of .prow rows: the card supplies the side padding, so
   the rows keep their own hairlines but the last one must not draw one. */
.cardlist{padding:2px 15px}
.cardlist .prow:last-child{border-bottom:0}
.card h4{margin:0;font-family:var(--title);font-size:calc(15.5px*var(--fs));font-weight:800;line-height:1.2}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--acc);margin-bottom:9px}
.rate{flex:none;font-size:10.5px;font-weight:600;color:var(--ink4)}

/* countdown */
.cdrow{display:flex;gap:6px;margin-top:2px}
.cdcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;
  border-radius:12px;background:var(--bg)}
.cdcell b{font-size:calc(25px*var(--fs));font-weight:800;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.cdcell i{font-size:9.5px;font-style:normal;font-weight:700;color:var(--ink4)}

/* currency converter */
.fxnote{font-size:11.5px;font-weight:600;color:var(--ink3);margin-bottom:11px}
.fxin{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:12px;
  padding:0 13px;height:48px;background:var(--bg);direction:ltr}
.fxin span{flex:none;font-size:16px;font-weight:800;color:var(--ink3)}
.fxin input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink);
  font:800 calc(21px*var(--fs))/1 var(--title);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fxin input::-webkit-outer-spin-button,.fxin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips2{display:flex;gap:6px;margin-top:9px}
.chips2 button{flex:1;padding:7px 2px;border-radius:999px;border:1px solid var(--line2);
  font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.fxout{display:flex;gap:8px;margin-top:11px}
.fxo{flex:1;display:flex;flex-direction:column;gap:4px;padding:11px 13px;border-radius:12px;
  background:var(--warnbg);border:1px solid var(--warnbd)}
.fxo i{font-size:10px;font-style:normal;font-weight:700;color:var(--ink3)}
.fxo b{font-size:calc(21px*var(--fs));font-weight:800;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;direction:ltr;text-align:end}
.fxo.sec{background:var(--bg);border-color:var(--line)}
.fxo.sec b{font-size:calc(17px*var(--fs));color:var(--ink2)}
</style>

<body>
<div id="app"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="data/trip.js"></script>
<script>
/* ===================== state ===================== */
var PK="jp2026:v3";
/* Bumped by hand on each deploy. Shown in the header so a glance at the phone
   tells you whether it picked up the latest push or is serving a stale copy. */
var BUILD="build 2026-08-29";

/* Landing at KIX: the only precise timestamp in the trip data, and the moment the
   trip actually starts. The countdown runs to this. */
var ARRIVE=new Date("2026-10-04T11:40:00+09:00");

/* Converter. The baked rate is the floor, not the goal — rural Japan is exactly
   where you need to check a price and have no signal, so the last good rate is
   cached and the network fetch is best-effort on top of it. */
var FXK="jp2026:fx", FX_FALLBACK={ils:0.018653,usd:0.006253,at:"2026-08-30"};
function fxGet(){
  try{var c=JSON.parse(localStorage.getItem(FXK)||"null"); if(c&&c.ils&&c.usd)return c;}catch(e){}
  return FX_FALLBACK;
}
function fxFetch(){
  if(fxFetch.busy)return; fxFetch.busy=true;
  var done=function(){fxFetch.busy=false;};
  fetch("https://api.frankfurter.dev/v1/latest?base=JPY&symbols=ILS,USD")
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j||!j.rates||!j.rates.ILS||!j.rates.USD)return;
      try{localStorage.setItem(FXK,JSON.stringify({ils:j.rates.ILS,usd:j.rates.USD,at:j.date}));}catch(e){}
      var n=document.getElementById("fxrate");
      if(n)n.textContent="שער · "+j.date;
      var e=document.getElementById("fxeg");
      if(e)e.textContent="¥1,000 ≈ ₪"+(1000*j.rates.ILS).toFixed(2);
      fxPaint();
    })
    .then(done,done);
}
function fxPaint(){
  var i=document.getElementById("fxi"); if(!i)return;
  var fx=fxGet(), v=parseFloat(i.value);
  var a=document.getElementById("fxils"), b=document.getElementById("fxusd");
  if(!isFinite(v)||v<=0){ if(a)a.textContent="—"; if(b)b.textContent="—"; return; }
  if(a)a.textContent="₪"+(v*fx.ils).toFixed(2);
  if(b)b.textContent="$"+(v*fx.usd).toFixed(2);
}

/* Ticks only while the countdown is on screen; bind() restarts it after each render. */
var cdTimer=null, CDIDS=["cdd","cdh","cdm","cds"];
function cdStop(){ if(cdTimer){clearInterval(cdTimer);cdTimer=null;} }
function cdParts(){
  var s=Math.max(0,Math.floor((ARRIVE-new Date())/1000));
  return [Math.floor(s/86400),Math.floor(s/3600)%24,Math.floor(s/60)%60,s%60];
}
function cdTick(){

/* ---- "now": during the trip the app should open on today, not on day 4 ---- */
function jstNow(){
  var p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",
    day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  var g={};p.forEach(function(x){g[x.type]=x.value;});
  return {y:+g.year,m:+g.month,d:+g.day,min:(+g.hour)*60+(+g.minute)};
}
function todayIdx(){
  var n=jstNow();
  if(n.y!==2026||n.m!==10)return -1;
  for(var i=0;i<T.DAYS.length;i++) if(T.DAYS[i].d===n.d) return i;
  return -1;
}
/* first stop today whose clock time hasn't passed yet; -1 if none/not today */
function nextStopIdx(day,items){
  if(T.DAYS.indexOf(day)!==todayIdx())return -1;
  var now=jstNow().min;
  for(var i=0;i<items.length;i++){
    var m=(items[i].t||"").match(/(\d{1,2}):(\d{2})/);
    if(m && (+m[1])*60+(+m[2]) >= now) return i;
  }
  return -1;
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function svg(d,sz,sw){return '<svg width="'+(sz||14)+'" height="'+(sz||14)+'" viewBox="0 0 24 24" fill="none" '
  +'stroke="currentColor" stroke-width="'+(sw||1.7)+'" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';}
function fmt(h){var m=Math.round(h*60);return m<60?m+" ד׳":(Math.floor(m/60)+" ש׳ "+(m%60?(m%60)+" ד׳":"")).trim();}

/* ---- Google Maps: a ROUTE to the spot, which is how this actually gets used.
   Coordinates when we have them (verified geocodes), else a name query. ---- */
function dirTo(it){
  var dest = (R && it.k && R.coords[it.k]) ? R.coords[it.k].join(",") : (it.q || it.n);
  return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest);
}
function dirFromTo(a,b){return "https://www.google.com/maps/dir/?api=1&origin="+a.join(",")+"&destination="+b.join(",");}
/* One tap from the day list into real Google Maps: start at the hotel, walk the
   day's mapped stops in order. Google's URL API caps waypoints, so long days get
   trimmed rather than silently failing. */
function dayRouteUrl(day,items){
  if(!R)return null;
  var stops=[];
  items.forEach(function(it){ if(it.k&&R.coords[it.k])stops.push(R.coords[it.k]); });
  if(!stops.length)return null;
  var base=R.coords[T.BASEKEY[day.base]];
  var origin=base||stops[0];
  var rest=base?stops.slice():stops.slice(1);
  if(!rest.length)return null;
  var dest=rest[rest.length-1], way=rest.slice(0,-1).slice(0,9);
  var u="https://www.google.com/maps/dir/?api=1&origin="+origin.join(",")
    +"&destination="+dest.join(",")+"&travelmode="+(dayKm(day)>10?"driving":"transit");
  if(way.length)u+="&waypoints="+way.map(function(p){return p.join(",");}).join("|");
  return u;
}
function searchFor(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}

/* ===================== day model ===================== */
function isVar(it){return /^(אופציה|גרסה|חלופה)/.test(it.n);}
function dayVars(day){return day.items.filter(isVar);}
function dayItems(day){
  var vs=dayVars(day); if(vs.length<2) return day.items;
  var p=S.variant[day.d]||0;
  return day.items.filter(function(it){return !isVar(it)||it===vs[p];});
}
function dayKm(day){return R?dayItems(day).reduce(function(a,it){return a+(it.drive&&R.drives[it.drive]?R.drives[it.drive].km:0);},0):0;}
function dayHrs(day){return R?dayItems(day).reduce(function(a,it){return a+(it.drive&&R.drives[it.drive]?R.drives[it.drive].hrs:0);},0):0;}
function daySig(day){
  var have={};day.items.forEach(function(it){if(it.c)have[it.c]=1;});
  if(dayKm(day)>60)have.drive=1;
  var order=T.SIG_PRIO.slice();
  if(dayKm(day)>100)order=["drive"].concat(order.filter(function(c){return c!=="drive";}));
  var out=[];order.forEach(function(c){if(have[c]&&out.length<3)out.push(T.CAT[c].i);});
  return out;
}

function lineF(pts,color,dash){return {type:"Feature",properties:{color:color,dash:!!dash},

var dt;

function drawNow(){
  if(!map||!styleReady||!R)return;
  if(!host().isConnected)return;   /* nothing on screen to draw into */
  markers.forEach(function(m){m.remove();});markers=[];pinEls={};
  var src=map.getSource("routes"),feats=[],pts=[],queue=[];
  if(S.view==="trip"){
    ["kyoto_seki","seki_gujo","gujo_matsumoto","matsumoto_gotemba"].forEach(function(id){
      if(R.drives[id])feats.push(lineF(R.drives[id].line,"#274B8C"));});
    [["osaka","kyoto"],["gotemba","tokyo"]].forEach(function(p){
      if(R.coords[p[0]]&&R.coords[p[1]])feats.push(lineF([R.coords[p[0]],R.coords[p[1]]],"#8A9099",true));});
    T.NIGHTS.forEach(function(b,i){var k=T.BASEKEY[b[0]];if(!R.coords[k])return;
      queue.push([R.coords[k],i+1,T.C[b[0]],b[1],k]);pts.push(R.coords[k]);});
    fit(pts,7.6);
  }else{
    var day=T.DAYS[S.sel],c=T.C[day.base],items=dayItems(day),n=0;
    items.forEach(function(it){if(it.drive&&R.drives[it.drive]){feats.push(lineF(R.drives[it.drive].line,c));
      R.drives[it.drive].line.forEach(function(p){pts.push(p);});}});
    items.forEach(function(it){if(!it.k||!R.coords[it.k])return;n++;
      queue.push([R.coords[it.k],n,c,it.n,it.k]);pts.push(R.coords[it.k]);});
    var bk=T.BASEKEY[day.base];
    if(R.coords[bk])pts.push(R.coords[bk]);
    fit(pts,12.6);
    /* saved recommendations for this city, as faint secondary pins — context,
       not itinerary, so they never join the numbering or the bounds */
    T.SCREENS.recs.groups.forEach(function(g){
      if(g.city!==day.base)return;
      g.rows.forEach(function(r){

function fit(pts,mz){
  if(!pts.length||!map)return;
  var el=map.getContainer();
  if(!el||el.clientWidth<40||el.clientHeight<40){clearTimeout(ft);ft=setTimeout(function(){fit(pts,mz);},240);return;}
  var b=new maplibregl.LngLatBounds();pts.forEach(function(p){b.extend([p[1],p[0]]);});
  var tall=el.clientHeight>200,pad=tall?{top:40,bottom:40,left:34,right:34}:{top:18,bottom:22,left:24,right:24};
  map.resize();

function bind(){
  var q=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
  q("[data-go]").forEach(function(b){b.onclick=function(){go(+b.dataset.go);};});
  q("[data-jump]").forEach(function(b){b.onclick=function(){go(+b.dataset.jump);};});
  q("[data-view]").forEach(function(b){b.onclick=function(){S.view=b.dataset.view;S.open=null;render();
    var y=document.getElementById("body");if(y)y.scrollTop=0;};});
  q("[data-stop]").forEach(function(b){b.onclick=function(e){
    if(e.target.closest("a"))return;                 /* let the Maps link through */
    if(b.dataset.stop)jump(b.dataset.stop);};});
  q("[data-var]").forEach(function(b){b.onclick=function(){
    var m=Object.assign({},S.variant);m[T.DAYS[S.sel].d]=+b.dataset.var;S.variant=m;S.open=null;save();render();};});
  q("[data-prep]").forEach(function(b){b.onclick=function(){S.prep=b.dataset.prep;render();};});
  q("[data-done]").forEach(function(b){b.onclick=function(){
    var m=Object.assign({},S.done),id=b.dataset.done;
    var cur=(S.done[id]!==undefined)?S.done[id]:b.querySelector(".box").style.background!=="transparent";
    m[id]=!cur;S.done=m;save();render();};});
  var td=document.getElementById("today"); if(td)td.onclick=function(){var i=todayIdx();if(i>=0)go(i);};
  var gr=document.getElementById("grab"); if(gr){gr.onclick=function(){S.mapOpen=true;render();};
    gr.onpointerdown=function(e){dragUp(e,function(){S.mapOpen=true;render();},-26);};}
  var mc=document.getElementById("mapclose"); if(mc)mc.onclick=function(){S.mapOpen=false;render();};
  var sb=document.getElementById("sheetbar"); if(sb)sb.onpointerdown=function(e){
    dragUp(e,function(){S.mapOpen=false;render();},30);};
  cdStop();
  if(document.getElementById("cd")){cdTick();cdTimer=setInterval(cdTick,1000);}
  var fi=document.getElementById("fxi");
  if(fi){ fi.oninput=fxPaint; fxPaint(); fxFetch();
    q("[data-fx]").forEach(function(b){b.onclick=function(){fi.value=b.dataset.fx;fxPaint();};}); }
  var body=document.getElementById("body");
  if(body&&S.view==="day")body.onpointerdown=swipeDays;
}
function dragUp(e,fn,threshold){
  var sy=e.clientY,fired=false;
  function move(ev){var dy=ev.clientY-sy;
    if(!fired&&((threshold<0&&dy<threshold)||(threshold>0&&dy>threshold))){fired=true;fn();up();}}
  function up(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);}
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
}
function swipeDays(e){
  var sx=e.clientX,sy=e.clientY,fired=false;
  function move(ev){
    if(fired)return;
    var dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6){
      fired=true;
      var n=S.sel+(dx>0?-1:1);           /* RTL: drag right = earlier day */
      if(n>=0&&n<T.DAYS.length)go(n);
      up();
    }
  }
  function up(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);}
  window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
}

/* ===================== live weather =====================
   Open-Meteo: free, no key, CORS-open. It only forecasts ~16 days out, and the
   trip is further away than that for now — so until mid-September every day
   legitimately has no forecast and we keep showing October climate normals,
   labelled as such. Once a date comes into range the real numbers replace them
   on their own, and the label changes to say it is a forecast. */
var LIVE={};
var LASTNAV=null;   /* last screen+day, so the entrance animation only runs on real navigation */
function wxFetch(base){
  var day=T.DAYS[S.sel], pt=T.WX_POINT[base];
  if(!pt||LIVE[base+day.d]!==undefined)return;
  LIVE[base+day.d]=null;                       /* in-flight: don't refetch */
  var date="2026-10-"+String(day.d).padStart(2,"0");
  var u="https://api.open-meteo.com/v1/forecast?latitude="+pt[0]+"&longitude="+pt[1]
    +"&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code"
    +"&timezone=Asia%2FTokyo&start_date="+date+"&end_date="+date;
  fetch(u).then(function(r){return r.json();}).then(function(j){
    if(!j||j.error||!j.daily||j.daily.temperature_2m_max[0]==null)return;   /* out of range */
    var code=j.daily.weather_code[0];
    LIVE[base+day.d]={hi:Math.round(j.daily.temperature_2m_max[0]),lo:Math.round(j.daily.temperature_2m_min[0]),
      rain:j.daily.precipitation_probability_max[0]!=null?j.daily.precipitation_probability_max[0]:0,
      k: code>=51?"rain":code>=2?"mixed":"clear", live:true};
    render();
  }).catch(function(){});
}

/* During the trip, open on today rather than on the last day viewed or day 4.
   Only on a fresh load — once you navigate, the app stays where you put it. */
(function(){ var i=todayIdx(); if(i>=0){ S.sel=i; S.view="day"; } })();

/* The shell height must equal the ACTUAL visible area. CSS units kept getting this
   wrong on iOS Safari: dvh under-reported (gap under the nav), inset:0 with
   viewport-fit=cover over-reported (ran under the toolbar), and svh is a fixed value
   that mismatches whenever the toolbar sits collapsed. visualViewport.height is the
   measured truth — use it, and re-measure whenever Safari resizes or shifts it.
   The CSS 100svh stays as the pre-paint fallback. */
function fitShell(){
  var app=document.getElementById("app"); if(!app) return;
  if(innerWidth>=760){ app.style.height=""; return; }   /* desktop keeps the card */
  var vv=window.visualViewport;
  app.style.height=Math.round(vv?vv.height:innerHeight)+"px";
}
addEventListener("resize",fitShell);
addEventListener("orientationchange",function(){setTimeout(fitShell,200);});
if(window.visualViewport){ visualViewport.addEventListener("resize",fitShell);
  visualViewport.addEventListener("scroll",fitShell); }
fitShell();
render();
fitShell();
/* ?debug=1 — read-only readout of the numbers that decide whether the nav lands on
   the bottom edge. Four shell-sizing attempts failed on iOS without ever seeing these,
   so if it is still wrong, screenshot this instead of guessing again. */
if(/[?&]debug=1/.test(location.search)){
  var dbg=document.createElement("div");
  dbg.style.cssText="position:fixed;left:6px;bottom:6px;z-index:9999;max-width:94vw;"
    +"background:rgba(0,0,0,.88);color:#0f0;font:11px/1.45 ui-monospace,Menlo,monospace;"
    +"padding:8px 10px;border-radius:8px;white-space:pre;direction:ltr;text-align:left;pointer-events:none";
  document.body.appendChild(dbg);
  var probe=document.createElement("div");
  probe.style.cssText="position:fixed;top:0;left:0;width:0;height:100dvh;pointer-events:none;visibility:hidden";
  document.body.appendChild(probe);
  var draw=function(){
    var vv=window.visualViewport, app=document.getElementById("app");
    var nav=app&&app.querySelector("nav"), ar=app?app.getBoundingClientRect():null;
    var nr=nav?nav.getBoundingClientRect():null;
    var cs=getComputedStyle(document.documentElement);
    var L=[];
    L.push("standalone   "+(navigator.standalone||matchMedia("(display-mode:standalone)").matches));
    L.push("innerHeight  "+innerHeight);
    L.push("vv.height    "+(vv?Math.round(vv.height*10)/10:"-"));
    L.push("vv.offsetTop "+(vv?Math.round((vv.offsetTop||0)*10)/10:"-"));
    L.push("vv.pageTop   "+(vv?Math.round((vv.pageTop||0)*10)/10:"-"));
    L.push("vv.scale     "+(vv?Math.round((vv.scale||1)*100)/100:"-"));
    L.push("100dvh       "+probe.getBoundingClientRect().height);
    L.push("safe-top     "+cs.getPropertyValue("--sat"));
    L.push("safe-bottom  "+cs.getPropertyValue("--sab"));
    L.push("app.top      "+(ar?Math.round(ar.top*10)/10:"-"));
    L.push("app.bottom   "+(ar?Math.round(ar.bottom*10)/10:"-"));
    L.push("app.height   "+(ar?Math.round(ar.height*10)/10:"-"));
    L.push("nav.bottom   "+(nr?Math.round(nr.bottom*10)/10:"-"));
    L.push("nav.height   "+(nr?Math.round(nr.height*10)/10:"-"));
    L.push("GAP below nav "+(nr&&vv?Math.round((vv.height-nr.bottom)*10)/10:"-"));
    dbg.textContent=L.join(String.fromCharCode(10));
  };
  draw();
  addEventListener("resize",draw); addEventListener("scroll",draw,true);
  if(window.visualViewport){visualViewport.addEventListener("resize",draw);visualViewport.addEventListener("scroll",draw);}
  setInterval(draw,500);
}
fetch("data/route.json").then(function(r){return r.json();}).then(function(j){R=j;render();})
  .catch(function(e){console.warn("route data:",e);});
</script>
</body>
