*{box-sizing:border-box;margin:0;padding:0}
:root{

}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0C0F;--card:#161A20;--sunk:#1E232B;--ink:#E9ECF1;--ink2:#9BA5B4;--ink3:#6B7484;
  --line:#252B34;--accent:#89A9E8;--accent-soft:#16203A;
}}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Assistant","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.app{max-width:620px;margin:0 auto;padding-bottom:calc(30px + var(--sab))}

.head{padding:calc(12px + var(--sat)) 16px 8px}
.head h1{font-size:19px;font-weight:800}
.head p{font-size:12.5px;color:var(--ink2)}

#map{height:40vh;min-height:280px;width:100%;background:var(--sunk);z-index:1}
#map.mapfail{display:flex;align-items:center;justify-content:center;text-align:center;height:auto;min-height:0;padding:16px}
.mapmsg{font-size:13px;color:var(--ink2)}.mapmsg a{color:var(--accent);font-weight:700}
.pin span{display:flex;width:26px;height:26px;border-radius:50%;background:var(--c,#274B8C);border:2.5px solid #fff;
  color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pin{cursor:pointer}
.maplibregl-popup-content{font-family:inherit;direction:rtl;font-size:13px;padding:7px 11px;border-radius:9px;
  box-shadow:0 2px 10px rgba(0,0,0,.22);color:#0F1317}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-attrib a{color:#4a5568}

/* day chips */
.daybar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:9px 0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.daybar .row{display:flex;gap:7px;padding:0 14px;width:max-content}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 11px;
  cursor:pointer;text-align:center;min-width:52px;font-family:inherit;color:var(--ink)}
.chip .dw{font-size:10.5px;color:var(--ink3);font-weight:700;display:block;line-height:1.3}
.chip .dn{font-size:14.5px;font-weight:800;display:block;line-height:1.25}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .dw{color:rgba(255,255,255,.85)}
.chip.all{min-width:auto;display:flex;align-items:center;font-size:13px;font-weight:800;padding:6px 13px}

/* day header */
.dayhead{padding:14px 16px 4px}
.dayhead h2{font-size:20px;font-weight:800;line-height:1.25}
.dayhead .meta{font-size:13px;color:var(--ink2);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--sunk);color:var(--ink2);margin-inline-end:5px}
.tag.c{background:var(--c);color:#fff}

/* items */
.items{padding:8px 14px 0}
.item{display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:11px 12px;cursor:pointer;align-items:flex-start}
.item:hover{box-shadow:0 3px 12px rgba(0,0,0,.10)}
.badge{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c,#274B8C);color:#fff;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.badge.bed{background:var(--sunk);color:var(--ink2);font-size:13px}
.ib{flex:1;min-width:0}
.iname{font-weight:700;font-size:15.5px;line-height:1.3}
.isub{font-size:13px;color:var(--ink2);margin-top:2px}
.itime{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  border-radius:6px;padding:2px 7px;display:inline-block;margin-top:6px}
.opt{font-size:10.5px;font-weight:700;color:var(--ink3);border:1px dashed var(--line);
  border-radius:6px;padding:1px 6px;margin-inline-start:6px}

/* travel connector */
.leg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);padding:7px 12px 7px 0;
  margin-inline-start:11px;border-inline-start:2px dotted var(--line)}
.leg a{color:var(--accent);font-weight:700;text-decoration:none}
.leg .m{font-weight:700}

.note{background:var(--sunk);border-radius:12px;padding:10px 13px;font-size:12.5px;color:var(--ink2);
  margin:10px 14px 0;line-height:1.55}
.note.warn{background:#FBEAE0;color:#7a3a1c}
@media (prefers-color-scheme:dark){.note.warn{background:#2E1B12;color:#E8A583}}
.foot{padding:20px 16px;font-size:11px;color:var(--ink3);text-align:center;line-height:1.7}
</style>
</head>

  {k:"nakameguro",n:"Nakameguro · נהר Meguro",s:"אחה״צ וערב לאורך הנהר — קפה, ברים, ארוחה (או Ebisu)"}],
  note:"teamLab אופציונלי בערב — היה עמוס בתיירים, לבדוק יום/שעה."},
{d:20,dow:"ג׳",base:"tokyo",t:"יציאה · NRT 18:00",items:[
  {k:"kagurazaka",n:"בוקר קליל ליד המלון",s:"ארוחת בוקר, קניות אחרונות, קפה"},
  {n:"יציאה לנמל התעופה",s:"לצאת ~14:30 · טיסה 18:00 מ-NRT",t:"~14:30",leg:{mode:"rail",hrs:1.3,txt:"טוקיו → NRT"}}],
  note:"בלי אזור או טיול גדול — מרווח ביטחון לשדה."}
];

/* ---------- helpers ---------- */
function fmt(h){var m=Math.round(h*60);return m<60?m+" ד׳":Math.floor(m/60)+" ש׳ "+(m%60?(m%60)+" ד׳":"").trim();}
var MODE={car:"🚗 נהיגה",rail:"🚆 רכבת",bus:"🚌 אוטובוס",walk:"🚶 הליכה"};

var R=null,map=null,mapReady=false,styleReady=false,pendingDraw=null,markers=[],sel="all";

/* ---------- map ----------
   Vector tiles (MapLibre + OpenFreeMap) rather than raster, so labels can be forced
   to Latin script — data/style-liberty-latin.json is Liberty with every name-based
   text-field rewritten to coalesce(name:latin, name_en, name). */
try{
  if(typeof maplibregl==="undefined") throw new Error("MapLibre failed to load");
  map=new maplibregl.Map({
    container:"map",
    style:"data/style-liberty-latin.json",
    center:[137.9,36.3],zoom:4.6,
    attributionControl:{compact:true,
      customAttribution:'<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>'}
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-left");
  map.scrollZoom.disable();          // page scroll must win on mobile
  map.dragRotate.disable();          // keep it north-up like a paper itinerary
  map.touchZoomRotate.disableRotation();
  map.on("error",function(e){console.warn("map:",e&&e.error&&e.error.message);});
  /* "style.load", not "load": load also waits for the first rendered frame, which never
     comes in a background tab (no requestAnimationFrame) — the overlays would stay undrawn. */
  map.on("style.load",function(){
    styleReady=true;addRouteLayers();
    if(pendingDraw){var f=pendingDraw;pendingDraw=null;f();}
  });
  mapReady=true;
}catch(err){
  console.error("map init failed:",err);
  var mEl=document.getElementById("map");mEl.className="mapfail";
  mEl.innerHTML='<div class="mapmsg">🗺️ המפה לא נטענה — התוכנית למטה עובדת כרגיל.</div>';
}

var EMPTY={type:"FeatureCollection",features:[]};
function addRouteLayers(){
  if(map.getSource("routes"))return;
  map.addSource("routes",{type:"geojson",data:EMPTY});
  map.addLayer({id:"routes-dash",type:"line",source:"routes",filter:["==",["get","dash"],true],
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["get","color"],"line-width":2.6,"line-opacity":.9,"line-dasharray":[2,2]}});
  map.addLayer({id:"routes-solid",type:"line",source:"routes",filter:["!=",["get","dash"],true],
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["get","color"],"line-width":4.5,"line-opacity":.9}});
}
/* run fn once the style is ready; MapLibre rejects addSource before "load" */
function onMap(fn){ if(!mapReady)return; if(styleReady)fn(); else pendingDraw=fn; }

/* route.json stores [lat,lon]; GeoJSON and MapLibre want [lon,lat] */
function line(latlngs,color,dash){
  return {type:"Feature",properties:{color:color,dash:!!dash},
    geometry:{type:"LineString",coordinates:latlngs.map(function(p){return [p[1],p[0]];})}};
}
function setRoutes(feats){
  var s=map.getSource("routes");if(s)s.setData({type:"FeatureCollection",features:feats});
}
function clearPins(){markers.forEach(function(m){m.remove();});markers=[];}
function pin(ll,label,color,popup){
  var el=document.createElement("div");el.className="pin";
  el.innerHTML='<span style="--c:'+color+'">'+label+'</span>';
  var m=new maplibregl.Marker({element:el,anchor:"center"}).setLngLat([ll[1],ll[0]]);
  if(popup)m.setPopup(new maplibregl.Popup({offset:16,closeButton:false}).setHTML(popup));
  m.addTo(map);markers.push(m);
}
function fit(pts,maxZoom){
  if(!pts.length)return;
  var b=new maplibregl.LngLatBounds();
  pts.forEach(function(p){b.extend([p[1],p[0]]);});
  map.fitBounds(b,{padding:{top:46,bottom:34,left:34,right:34},maxZoom:maxZoom||14,duration:650});
}

function drawAll(){
  if(!R)return;
  onMap(function(){
    clearPins();var pts=[],feats=[];
    ["kyoto_gujo","gujo_matsumoto","matsumoto_gotemba"].forEach(function(id){
      if(R.drives[id])feats.push(line(R.drives[id].line,"#274B8C"));
    });
    [["osaka","kyoto"],["gotemba","tokyo"]].forEach(function(p){
      if(R.coords[p[0]]&&R.coords[p[1]])feats.push(line([R.coords[p[0]],R.coords[p[1]]],"#8A93A2",true));
    });
    setRoutes(feats);
    [["osaka","1 · אוסקה"],["kyoto","2 · קיוטו"],["gujo","3 · גוג׳ו"],["matsumoto","4 · מטסומוטו"],
     ["gotemba","5 · פוג׳י"],["tokyo","6 · טוקיו"]].forEach(function(b,i){
      var c=[C.osaka,C.kyoto,C.gujo,C.matsumoto,C.fuji,C.tokyo][i];
      if(!R.coords[b[0]])return;
      pin(R.coords[b[0]],i+1,c,"<b>"+b[1]+"</b>");pts.push(R.coords[b[0]]);
    });
    fit(pts,9);
  });
}
function drawDay(day){
  if(!R)return;
  onMap(function(){
    clearPins();var pts=[],feats=[],c=C[day.base],n=0;
    day.items.forEach(function(it){if(it.drive&&R.drives[it.drive]){
      feats.push(line(R.drives[it.drive].line,c));
      R.drives[it.drive].line.forEach(function(p){pts.push(p);});}});
    setRoutes(feats);
    day.items.forEach(function(it){
      if(!it.k||!R.coords[it.k])return;n++;
      pin(R.coords[it.k],n,c,"<b>"+it.n+"</b>");pts.push(R.coords[it.k]);
    });
    fit(pts,13);
  });
}

/* ---------- render ---------- */
function render(){
  var el=document.getElementById("content");
  if(sel==="all"){
    var rows=[["osaka","אוסקה","4–7/10","3 לילות"],["kyoto","קיוטו","7–9/10","2 לילות"],
      ["gujo","גוג׳ו","9–10/10","לילה"],["matsumoto","מטסומוטו","10–13/10","3 לילות"],
      ["fuji","פוג׳י · גוטמבה","13–15/10","2 לילות"],["tokyo","טוקיו","15–20/10","5 לילות"]];
    var legs=R?[["kyoto_gujo","קיוטו → גוג׳ו"],["gujo_matsumoto","גוג׳ו → Narai → מטסומוטו"],
      ["matsumoto_gotemba","מטסומוטו → גוטמבה"]]:[];
    el.innerHTML='<div class="dayhead"><h2>כל הטיול</h2><div class="meta">שש תחנות · 16 לילות · שתי מכוניות</div></div>'
      +'<div class="items">'+rows.map(function(r,i){
        return '<div class="item" style="--c:'+C[r[0]]+'" data-jump="'+r[0]+'"><span class="badge">'+(i+1)+'</span>'
          +'<div class="ib"><div class="iname">'+r[1]+'</div><div class="isub">'+r[2]+' · '+r[3]+' · '+HOTEL[r[0]]+'</div></div></div>'
          +(i<rows.length-1?'<div style="height:7px"></div>':'');
      }).join("")+'</div>'
      +(legs.length?'<div class="note"><b>רגלי הנהיגה (מחושב על הכביש בפועל):</b><br>'
        +legs.map(function(l){var d=R.drives[l[0]];return "· "+l[1]+" — <b>"+d.km+" ק״מ · "+fmt(d.hrs)+"</b>";}).join("<br>")
        +'<br><span style="opacity:.8">אוסקה→קיוטו וגוטמבה→טוקיו ברכבת (קו מקווקו במפה).</span></div>':"")
      +'<div class="note">בחרו יום מהסרגל למעלה כדי לראות את העצירות של אותו יום על המפה.</div>';
    drawAll();
  }else{
    var day=DAYS[sel],c=C[day.base],n=0;
    var html='<div class="dayhead"><h2>'+day.t+'</h2><div class="meta">'
      +'<span class="tag c" style="--c:'+c+'">'+day.dow+' · '+day.d+'/10</span>'
      +'<span class="tag">🛏️ '+HOTEL[day.base]+'</span></div></div><div class="items">';
    day.items.forEach(function(it,i){
      var lg=it.leg,dr=it.drive&&R?R.drives[it.drive]:null;
      /* a drive on the first item starts from that day's base, not from a previous stop */
      if(dr)lg={mode:"car",hrs:dr.hrs,km:dr.km,txt:i===0?("מ"+BASENAME[day.base]):(it.leg&&it.leg.txt)};
      if(lg){
        var fromK=i>0?(day.items[i-1]||{}).k:BASEKEY[day.base],dirs="";
        if(R&&it.k&&fromK&&R.coords[it.k]&&R.coords[fromK])
          dirs=' · <a href="https://www.google.com/maps/dir/'+R.coords[fromK]+'/'+R.coords[it.k]+'" target="_blank" rel="noopener">הוראות הגעה ›</a>';
        html+='<div class="leg"><span class="m">'+MODE[lg.mode]+'</span> '+fmt(lg.hrs)
          +(lg.km?' · '+lg.km+' ק״מ':'')+(lg.txt?' · '+lg.txt:'')+dirs+'</div>';
      }else if(i>0)html+='<div style="height:7px"></div>';
      if(it.k)n++;
      html+='<div class="item" style="--c:'+c+'"'+(it.k?' data-jump="'+it.k+'"':'')+'>'
        +'<span class="badge">'+(it.k?n:"·")+'</span><div class="ib">'
        +'<div class="iname">'+it.n+(it.opt?'<span class="opt">אופציונלי</span>':'')+'</div>'
        +'<div class="isub">'+it.s+'</div>'+(it.t?'<div class="itime">'+it.t+'</div>':'')+'</div></div>';
    });
    html+='<div style="height:7px"></div><div class="item"><span class="badge bed">🛏️</span><div class="ib">'
      +'<div class="iname">'+HOTEL[day.base]+'</div><div class="isub">לינה</div></div></div></div>';
    if(day.note)html+='<div class="note'+(day.note.indexOf("⚠️")===0?" warn":"")+'">'+day.note+'</div>';
    el.innerHTML=html;
    drawDay(day);
  }
  el.querySelectorAll("[data-jump]").forEach(function(node){
    node.addEventListener("click",function(){
      var k=node.dataset.jump;
      if(mapReady&&R&&R.coords[k]){
        map.flyTo({center:[R.coords[k][1],R.coords[k][0]],zoom:12,duration:800});
        document.getElementById("map").scrollIntoView({behavior:"smooth",block:"start"});}
    });
  });
}

/* ---------- day chips ---------- */
var bar=document.getElementById("daybar");
function chip(label,val,isAll){
  var b=document.createElement("button");
  b.className="chip"+(isAll?" all":"")+(val===sel?" on":"");
  b.innerHTML=isAll?label:'<span class="dw">'+label.dow+'</span><span class="dn">'+label.d+'</span>';
  b.addEventListener("click",function(){
    sel=val;bar.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");render();
  });
  return b;
}
bar.appendChild(chip("כל הטיול","all",true));
DAYS.forEach(function(d,i){bar.appendChild(chip(d,i));});

/* ---------- load baked route data, then render ---------- */
fetch("data/route.json").then(function(r){return r.json();}).then(function(j){R=j;render();})
  .catch(function(e){console.error("route data failed:",e);render();});
</script>
</body>
